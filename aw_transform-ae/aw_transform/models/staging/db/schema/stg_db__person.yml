version: 2

models:
  - name: stg_db__person
    description: "Staging model for person data"
    columns:
      - name: business_entity_id
        data_type: int
        description: "Primary key for the person"
        tests:
          - unique
          - not_null

      - name: person_type
        data_type: varchar
        description: "Type of person"
        tests:
          - not_null
          - accepted_values:
              values: ["Store Contact", "Individual (retail) customer", "Sales person", "Employee (non-sales)", "Vendor contact", "General contact", "Other"]

      - name: full_name
        data_type: varchar
        description: "Full name of the person"
        tests:
          - not_null
