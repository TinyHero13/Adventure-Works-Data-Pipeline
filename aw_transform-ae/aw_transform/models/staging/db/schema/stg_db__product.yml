version: 2

models:
  - name: stg_db__product
    description: "Staging model for product data"
    columns:
      - name: product_id
        data_type: int
        description: "Primary key for the product"
        tests:
          - unique
          - not_null

      - name: product_name
        data_type: varchar
        description: "Name of the product"
        tests:
          - not_null

      - name: product_number
        data_type: varchar
        description: "Product number"
        tests:
          - not_null
          - unique

      - name: make_flag
        data_type: varchar
        description: "Indicates if product is made or purchased"
        tests:
          - accepted_values:
              values: ["Purchased", "Manufactured"]

      - name: finished_goods_flag
        data_type: varchar
        description: "Indicates if product is finished"
        tests:
          - accepted_values:
              values: ["Not Finished", "Finished"]

      - name: color
        data_type: varchar
        description: "Color of the product"

      - name: safety_stock_level
        data_type: int
        description: "Minimum inventory quantity"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

      - name: reorder_point
        data_type: int
        description: "Inventory level that triggers a purchase order or work order."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

      - name: list_price
        data_type: decimal(19,4)
        description: "List price of the product"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

      - name: size
        data_type: varchar
        description: "Size of the product"

      - name: size_unit_measure_code
        data_type: varchar
        description: "Unit of measure for size column"

      - name: weight
        data_type: decimal(8,2)
        description: "Weight of the product"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

      - name: weight_unit_measure_code
        data_type: varchar
        description: "Unit of measure for weight column"

      - name: days_to_manufacture
        data_type: int
        description: "Number of days required to manufacture the product"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

      - name: product_line
        data_type: varchar
        description: "Product line category indicating the type of product: Road, Mountain, Touring, Standard, or Other"
        tests:
          - accepted_values:
              values: ["Road", "Mountain", "Touring", "Standard", "Other"]

      - name: class
        data_type: varchar
        description: "Product class"
        tests:
          - accepted_values:
              values: ["High", "Medium", "Low", "Other"]

      - name: style
        data_type: varchar
        description: "Style of the product"
        tests:
          - accepted_values:
              values: ["Mens", "Womens", "Universal", "Other"]

      - name: product_subcategory_id
        data_type: int
        description: "Foreign key to product subcategory"
        tests:
          - relationships:
              to: ref('stg_db__product_subcategory')
              field: product_subcategory_id

      - name: sell_start_date
        data_type: date
        description: "Start date for selling the product"
        tests:
          - not_null

      - name: sell_end_date
        data_type: date
        description: "End date for selling the product"

      - name: discontinued_date
        data_type: date
        description: "Date when product was discontinued"
