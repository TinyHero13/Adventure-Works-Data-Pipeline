version: 2

sources:
  - name: source_db
    description: "Source database for staging models"
    database: ted_dev
    schema: dev_yasmim_lima
    tables:

# Sales schema
      - name: sales_reason
        identifier: raw_db_sales_salesreason
        description: "staging table for sales reason"
      
      - name: sales_territory
        identifier: raw_db_sales_salesterritory
        description: "staging table for sales territory"

      - name: customer
        identifier: raw_db_sales_customer
        description: "staging table for customer"

      - name: sales_person
        identifier: raw_db_sales_salesperson
        description: "staging table for sales person"

      - name: sales_order_detail
        identifier: raw_db_sales_salesorderdetail
        description: "staging table for sales order detail"

      - name: sales_order_header
        identifier: raw_db_sales_salesorderheader
        description: "staging table for sales order header"
# Production schema
      - name: product
        identifier: raw_db_production_product
        description: "staging table for product"

      - name: product_category
        identifier: raw_db_production_productcategory
        description: "staging table for product category"
      
      - name: product_subcategory
        identifier: raw_db_production_productsubcategory
        description: "staging table for product subcategory"

      - name: person
        identifier: raw_db_person_person
        description: "staging table for person"