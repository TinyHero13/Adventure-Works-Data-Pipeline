version: 2

models:
  - name: int_payment_method
    description: "Intermediate table for payment method dimensions combining credit card types into standardized payment methods"
    columns:
      - name: payment_method_id
        description: "Unique identifier for payment method"

      - name: payment_method_name
        description: "Name of the payment method (card type)"

      - name: updated_at
        description: "Timestamp when the record was loaded"
