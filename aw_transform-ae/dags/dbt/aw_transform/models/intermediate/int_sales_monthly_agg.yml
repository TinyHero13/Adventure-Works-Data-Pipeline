version: 2

models:
  - name: int_sales_monthly_agg
    description: "Intermediate table with monthly aggregated sales metrics by territory, product, and payment method"
    columns:
      - name: month_year
        description: "Reference month for the aggregation"

      - name: territory_id
        description: "Territory identifier"

      - name: product_id
        description: "Product identifier"

      - name: payment_method_id
        description: "Payment method identifier"

      - name: year_actual
        description: "Year of the transaction"

      - name: month_actual
        description: "Month of the transaction"

      - name: month_name
        description: "Name of the month"

      - name: quarter_actual
        description: "Quarter of the transaction"

      - name: mmyyyy
        description: "Month and year in MMYYYY format"

      - name: total_sales_transactions
        description: "Total number of sales transactions"

      - name: total_orders
        description: "Total number of orders"

      - name: unique_customers
        description: "Number of unique customers"

      - name: total_revenue
        description: "Total revenue amount"

      - name: total_order_value
        description: "Total order value"

      - name: total_freight
        description: "Total freight amount"

      - name: total_discount_amount
        description: "Total discount amount"

      - name: total_quantity_sold
        description: "Total quantity sold"

      - name: total_items_in_orders
        description: "Total items in orders"

      - name: avg_order_value
        description: "Average order value"

      - name: avg_revenue_per_customer
        description: "Average revenue per customer"

      - name: avg_items_per_order
        description: "Average items per order"

      - name: avg_unit_price
        description: "Average unit price"

      - name: avg_days_to_ship
        description: "Average days to ship"

      - name: online_revenue
        description: "Revenue from online orders"

      - name: offline_revenue
        description: "Revenue from offline orders"

      - name: online_orders_count
        description: "Count of online orders"

      - name: offline_orders_count
        description: "Count of offline orders"

      - name: online_revenue_percentage
        description: "Percentage of revenue from online orders"

      - name: discount_percentage
        description: "Discount percentage"

      - name: freight_percentage
        description: "Freight percentage"

      - name: revenue_growth_mom
        description: "Month-over-month revenue growth percentage"

      - name: orders_growth_mom
        description: "Month-over-month orders growth percentage"

      - name: ytd_revenue
        description: "Year-to-date revenue"

      - name: ytd_orders
        description: "Year-to-date orders"

      - name: product_share_in_territory
        description: "Product's share of revenue within territory"

      - name: updated_at
        description: "Timestamp when the record was loaded"
