version: 2

models:
  - name: dim_territory
    description: "Territory dimension table with geographic and regional information"
    columns:
      - name: territory_pk
        description: "Unique identifier for territory"

      - name: territory_name
        description: "Name of the territory"

      - name: country_region_code
        description: "Country or region code"

      - name: group
        description: "Group name for the territory"

      - name: updated_at
        description: "Timestamp when the record was loaded"
