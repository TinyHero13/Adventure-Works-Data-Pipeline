version: 2

models:
  - name: dim_product
    description: "Product dimension table with complete product information and categorization"
    columns:
      - name: product_pk
        description: "Unique identifier for product"
        tests:
          - not_null
          - unique
      - name: product_name
        description: "Name of the product"
        tests:
          - not_null
      - name: product_number
        description: "Product number/SKU"
        tests:
          - not_null
      - name: product_category_name
        description: "Category name of the product"
      - name: product_subcategory_name
        description: "Subcategory name of the product"
      - name: color
        description: "Product color"
      - name: size
        description: "Product size"
      - name: size_unit_measure_code
        description: "Unit of measure for size"
      - name: weight
        description: "Product weight"
      - name: weight_unit_measure_code
        description: "Unit of measure for weight"
      - name: make_flag
        description: "Flag indicating if product is manufactured or purchased"
      - name: finished_goods_flag
        description: "Flag indicating if product is finished goods"
      - name: days_to_manufacture
        description: "Number of days required to manufacture"
      - name: product_line
        description: "Product line classification"
      - name: class
        description: "Product class"
      - name: style
        description: "Product style"
      - name: list_price
        description: "List price of the product"
        tests:
          - not_null
      - name: safety_stock_level
        description: "Safety stock level"
      - name: reorder_point
        description: "Reorder point for inventory"
      - name: sell_start_date
        description: "Date when product became available for sale"
      - name: sell_end_date
        description: "Date when product was discontinued from sale"
      - name: discontinued_date
        description: "Date when product was discontinued"

      - name: updated_at
        description: "Timestamp when the record was loaded"
        tests:
          - not_null
