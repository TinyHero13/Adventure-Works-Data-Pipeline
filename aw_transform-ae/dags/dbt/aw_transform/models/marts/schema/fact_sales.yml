version: 2

models:
  - name: fact_sales
    description: "Sales fact table with detailed transaction-level data"
    columns:
      - name: sales_order_pk
        description: "Unique identifier for sales order detail"
        tests:
          - not_null
          - unique
      - name: sales_order_pk
        description: "Identifier for sales order"
        tests:
          - not_null
      - name: customer_fk
        description: "Customer identifier"
        tests:
          - not_null
      - name: product_fk
        description: "Product identifier"
        tests:
          - not_null
      - name: sales_person_fk
        description: "Sales person identifier"
      - name: territory_fk
        description: "Territory identifier"
      - name: payment_method_pk
        description: "Payment method identifier"
      - name: order_date_id
        description: "Order date"
        tests:
          - not_null
      - name: quantity_sold
        description: "Quantity of items sold"
        tests:
          - not_null
      - name: price
        description: "Unit price of the item"
        tests:
          - not_null
      - name: price_total
        description: "Total price for the line item"
        tests:
          - not_null
      - name: unit_price_discount
        description: "Discount amount per unit"
      - name: online_order_flag
        description: "Flag indicating if order was placed online"
      - name: ship_date
        description: "Date the order was shipped"
      - name: due_date
        description: "Date the order is due"
      - name: freight_amount
        description: "Freight cost for the order"
      - name: order_total_amount
        description: "Total amount for the entire order"
      - name: total_items_quantity
        description: "Total quantity of items in the order"
      - name: days_to_ship
        description: "Number of days between order and ship date"

      - name: updated_at
        description: "Timestamp when the record was loaded"
        tests:
          - not_null
