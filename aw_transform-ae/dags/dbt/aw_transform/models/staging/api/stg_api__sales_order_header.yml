version: 2

models:
  - name: stg_api__sales_order_header
    description: "Staging model for sales order header data"
    columns:
      - name: sales_order_id
        data_type: int
        description: "Primary key for the sales order"
        tests:
          - unique
          - not_null

      - name: credit_card_id
        data_type: int
        description: "Foreign key to credit card"

      - name: customer_id
        data_type: int
        description: "Foreign key to customer"
        tests:
          - not_null

      - name: sales_person_id
        data_type: int
        description: "Foreign key to sales person"

      - name: territory_id
        data_type: int
        description: "Foreign key to territory"

      - name: bill_to_address_id
        data_type: int
        description: "Foreign key to bill to address"

      - name: ship_to_address_id
        data_type: int
        description: "Foreign key to ship to address"

      - name: ship_method_id
        data_type: int
        description: "Foreign key to ship method"

      - name: currency_rate_id
        data_type: int
        description: "Foreign key to currency rate"

      - name: revision_number
        data_type: int
        description: "Number to track changes to the sales order over time"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

      - name: order_date
        data_type: date
        description: "Order date"
        tests:
          - not_null

      - name: due_date
        data_type: date
        description: "Due date for the order"

      - name: ship_date
        data_type: date
        description: "Ship date"

      - name: status
        data_type: int
        description: "Order status"

      - name: online_order_flag
        data_type: varchar
        description: "Flag indicating if order was placed online"

      - name: sales_order_number
        data_type: varchar
        description: "Sales order number"

      - name: purchase_order_number
        data_type: varchar
        description: "Purchase order number"

      - name: account_number
        data_type: varchar
        description: "Account number"

      - name: credit_card_approval_code
        data_type: varchar
        description: "Credit card approval code"

      - name: subtotal
        data_type: numeric(19,4)
        description: "Order subtotal"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

      - name: total_due
        data_type: numeric(19,4)
        description: "Total amount due"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

      - name: freight
        data_type: numeric(19,4)
        description: "Shipping cost"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

      - name: updated_at
        data_type: timestamp
        description: "Timestamp when record was last updated"
