version: 2

models:
  - name: stg_db__address
    description: "Staging model for address data"
    columns:
      - name: address_id
        data_type: int
        description: "Primary key for the address"
        tests:
          - unique
          - not_null

      - name: city
        data_type: varchar
        description: "City name"
        tests:
          - not_null

      - name: state_province_id
        data_type: int
        description: "Foreign key to state province"
        tests:
          - not_null
          - relationships:
              to: ref('stg_db__state_province')
              field: state_province_id
