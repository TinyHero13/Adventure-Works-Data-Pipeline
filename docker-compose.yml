services:
  terraform:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - TF_VAR_DATABRICKS_HOST=${DATABRICKS_HOST}
      - TF_VAR_DATABRICKS_TOKEN=${DATABRICKS_TOKEN}
    volumes:
      - ./terraform:/workspace
      - terraform_state:/workspace/.terraform
    working_dir: /workspace

volumes:
  terraform_state: